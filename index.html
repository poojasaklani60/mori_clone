<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LocalLift Mobile | Local Services Marketplace</title>
  <meta name="description" content="Mobile-first buy and sell marketplace app for local services.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="mini-label">Nearby services</p>
        <h1>LocalLift</h1>
      </div>
      <button class="icon-pill" aria-label="Notifications">🔔</button>
    </header>

    <main class="app-content">
      <section id="homeTab" class="tab-screen active" aria-label="Home">
        <article class="hero-card">
          <h2>Book trusted local help in minutes.</h2>
          <p>Find plumbers, tutors, cleaners and more from your area.</p>
          <div class="hero-stats">
            <div><strong id="activeListings">0</strong><span>Listings</span></div>
            <div><strong id="openRequests">0</strong><span>Requests</span></div>
            <div><strong>22m</strong><span>Avg reply</span></div>
          </div>
        </article>

        <section class="panel">
          <h3>Find a service</h3>
          <div class="filters">
            <input type="text" id="searchInput" placeholder="Search services">
            <select id="categoryFilter">
              <option value="All">All categories</option>
              <option value="Home Repair">Home Repair</option>
              <option value="Education">Education</option>
              <option value="Events">Events</option>
              <option value="Wellness">Wellness</option>
              <option value="Cleaning">Cleaning</option>
              <option value="Tech">Tech</option>
            </select>
            <select id="locationFilter"><option value="All">All locations</option></select>
            <select id="sortBy">
              <option value="rating">Top rated</option>
              <option value="price-low">Lowest price</option>
              <option value="price-high">Highest price</option>
            </select>
          </div>
        </section>

        <section class="service-list" id="serviceGrid" aria-label="Service list"></section>
      </section>

      <section id="sellTab" class="tab-screen" aria-label="Sell">
        <section class="panel">
          <h3>Create service listing</h3>
          <p class="subtext">Get discovered by local customers.</p>
          <form id="sellForm" class="sell-form">
            <label>Service title<input type="text" id="title" required></label>
            <label>Provider name<input type="text" id="provider" required></label>
            <label>Category
              <select id="category" required>
                <option value="">Select category</option>
                <option value="Home Repair">Home Repair</option>
                <option value="Education">Education</option>
                <option value="Events">Events</option>
                <option value="Wellness">Wellness</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Tech">Tech</option>
              </select>
            </label>
            <label>Location<input type="text" id="location" required></label>
            <label>Price (NPR)<input type="number" id="price" min="1" required></label>
            <label>Description<textarea id="description" rows="3" required></textarea></label>
            <button type="submit" class="btn-primary">Publish</button>
            <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="tab-btn active" data-target="homeTab">🏠<span>Home</span></button>
      <button class="tab-btn" data-target="sellTab">➕<span>Sell</span></button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
